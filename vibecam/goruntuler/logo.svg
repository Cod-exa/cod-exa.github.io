<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#181829"/>
      <stop offset="60%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a4f"/>
      <stop offset="50%" stop-color="#1c1c28"/>
      <stop offset="100%" stop-color="#2a2a3c"/>
    </linearGradient>
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Matrix Grid Subtle Lines -->
  <g opacity="0.12" stroke="#00f5d4" stroke-width="1">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Outer Synthesizer Dial Ring -->
  <circle cx="256" cy="256" r="168" fill="url(#ring-metal)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="url(#neon-pink)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Inner Dark Lens Chamber -->
  <circle cx="256" cy="256" r="138" fill="#08080f" stroke="#1f1f2e" stroke-width="4"/>

  <!-- Chromatic Aberration Shift Rings -->
  <circle cx="248" cy="256" r="105" fill="none" stroke="url(#neon-cyan)" stroke-width="4" opacity="0.85" filter="url(#glow-c)"/>
  <circle cx="264" cy="256" r="105" fill="none" stroke="url(#neon-pink)" stroke-width="4" opacity="0.85" filter="url(#glow-p)"/>

  <!-- Synth Wave / Harmonic Cymatics Lines -->
  <path d="M176,256 C200,210 220,302 256,256 C292,210 312,302 336,256" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <path d="M190,256 C210,225 225,287 256,256 C287,225 302,287 322,256" fill="none" stroke="url(#neon-cyan)" stroke-width="3" stroke-linecap="round"/>

  <!-- Synthesizer Knob Notch Indicator -->
  <line x1="256" y1="98" x2="256" y2="124" stroke="url(#neon-cyan)" stroke-width="5" stroke-linecap="round" filter="url(#glow-c)"/>

  <!-- Center Core Aperture Dot -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow-c)"/>

  <!-- HUD Corner Markers -->
  <path d="M136,160 L136,136 L160,136" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M376,160 L376,136 L352,136" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round"/>
  <path d="M136,352 L136,376 L160,376" fill="none" stroke="#ff007f" stroke-width="3" stroke-linecap="round"/>
  <path d="M376,352 L376,376 L352,376" fill="none" stroke="#ff007f" stroke-width="3" stroke-linecap="round"/>
</svg>
