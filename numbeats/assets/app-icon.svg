<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Numbeats">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b18"/>
      <stop offset="1" stop-color="#1f1240"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#b6ff3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- waveform tiles with Fibonacci heights 1,2,3,5,8,5,3,2,1 -->
  <g fill="url(#bar)">
    <rect x="65" y="241" width="30" height="30" rx="15"/>
    <rect x="109" y="226" width="30" height="60" rx="15"/>
    <rect x="153" y="211" width="30" height="90" rx="15"/>
    <rect x="197" y="181" width="30" height="150" rx="15"/>
    <rect x="241" y="136" width="30" height="240" rx="15"/>
    <rect x="285" y="181" width="30" height="150" rx="15"/>
    <rect x="329" y="211" width="30" height="90" rx="15"/>
    <rect x="373" y="226" width="30" height="60" rx="15"/>
    <rect x="417" y="241" width="30" height="30" rx="15"/>
  </g>
  <circle cx="256" cy="96" r="12" fill="#ffffff"/>
  <circle cx="256" cy="416" r="12" fill="#ffffff" fill-opacity="0.55"/>
</svg>
